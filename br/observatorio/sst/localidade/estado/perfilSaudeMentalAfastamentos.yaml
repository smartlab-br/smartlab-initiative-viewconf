                  args:
                    - named_prop: "idLocalidade"
                args:
                  - prop: "value"
                    named_prop: 'agr_count'
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    template: '{0}<br/>B91'
                    args:
                      - named_prop: "ds_cbo2002"
              - relevance: 'high'
                cls: 'xs6'
                api:
                  template: "/sst/beneficios?categorias=ds_cbo2002&agregacao=COUNT&filtros=eq-cd_uf-{0},and,ne-ds_cbo2002-'',and,eq-cd_especie_beneficio-31,and,lk-cd_categoria_cid_beneficio-'F%25'&ordenacao=-agr_count&limit=1"
                  args:
