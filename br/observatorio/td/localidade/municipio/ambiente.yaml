# ====================================================          
secoes:
  - id: "ambiente_seguro_main_story"
    name: "Notificações de Acidentes de Trabalho"
    cards:
# ====================================================          
      - id: "mapa_acidente_trabalho"
        title: 
          fixed: "Notificações de Acidentes de Trabalho - Distribuição Geográfica"
        title_comment:
          template: "{0}, {1}"
          api:
            fixed: "/sst/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-2023"
          args:
            - base_object: "localidade"
              named_prop: "nm_localidade"
            - named_prop: "nu_competencia"
        info:
          - type: "text"
            title: "Sobre a métrica"
            content:
              template: "Define-se como acidente do trabalho aquele que ocorre pelo exercício do trabalho a serviço da empresa ou pelo exercício do trabalho dos segurados especiais, provocando lesão corporal ou perturbação funcional, permanente ou temporária, que cause a morte, a perda ou a redução da capacidade para o trabalho.<br/>
                          Consideram-se acidente do trabalho a doença profissional e a doença do trabalho. Equiparam-se também ao acidente do trabalho: o acidente ligado ao trabalho que, embora não tenha sido a causa única, haja contribuído diretamente para a ocorrência da lesão; certos acidentes sofridos pelo segurado no local e no horário de trabalho; a doença proveniente de contaminação acidental do empregado no exercício de sua atividade; e o acidente sofrido a serviço da empresa ou no trajeto entre a residência e o local de trabalho do segurado e vice-versa.<br/>
                          Os dados brutos analisados têm as seguintes referências fundamentais, para consulta e conferência:<br/>Nome: {0}<br/>Fonte: {1}<br/>Ano: {2}"
              api:
                fixed: "/sst/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-2023"
              args:
                - named_prop: 'cd_indicador'
                - named_prop: 'ds_fonte'
                - named_prop: 'nu_competencia'
        description:
          - type: "minicards"
            cards:
              - relevance: 'high'
                cls: 'xs12'
                api:
                  template: "/sst/indicadoresmunicipais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-2023,and,eq-cd_mun_ibge_dv-{0}"
                  args:
                    - named_prop: "idLocalidade"
                args:
                  - prop: "value"
                    named_prop: 'vl_indicador'
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    fixed: 'Acidentes no município'
              - relevance: 'low'
                cls: 'xs5'
                api:
                  template: "/sst/indicadoresestaduais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-2023,and,eq-cd_uf-{0}"
                  args:
                    - named_prop: "cd_uf"
                args:
                  - prop: "value"
                    named_prop: 'vl_indicador'
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    fixed: "Acidentes na UF"
              - relevance: 'low'
                cls: 'xs5'
                api:
                  fixed: "/sst/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-2023"
                args:
                  - prop: "value"
                    named_prop: 'vl_indicador'
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    fixed: "Acidentes no país"
          - type: "text"
            title: ""
            content:
              fixed: "Em destaque, o número de notificações de acidentes de trabalho no município entre a população com vínculo de emprego regular no ano indicado, incluindo tanto as Comunicações de Acidente de Trabalho (CAT) quanto os benefícios acidentários concedidos sem comunicação prévia (acidentes identificados no momento da concessão do benefício, sem registro de CAT). No mapa, apresenta-se uma perspectiva comparativa entre os municípios da unidade federativa. A escala de cores varia do branco (menor quantidade) ao vermelho (maior quantidade). Utilize o filtro abaixo para visualizar o número de acidentes por setor econômico. Considera-se o momento da compilação dos dados. Os números referentes a anos anteriores tendem a ser complementados de acordo com a chegada de notificações atrasadas nos anos subsequentes."
          - type: "ranking"
            api:
              template: "/sst/indicadoresmunicipais?categorias=rank_uf,rank_uf_total,rank_br,rank_br_total&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-2023,and,eq-cd_mun_ibge_dv-{0}"
              args:
                - named_prop: "idLocalidade"
            args:
              - prop: 'regional_rank'
                named_prop: "rank_uf"
                format: 'inteiro'
                precision: 0
                default: 0
              - prop: 'regional_total'
                named_prop: "rank_uf_total"
                format: 'inteiro'
                precision: 0
                default: 0
              - prop: 'national_rank'
                named_prop: "rank_br"
                format: 'inteiro'
                precision: 0
                default: 0
              - prop: 'national_total'
                named_prop: "rank_br_total"
                format: 'inteiro'
                precision: 0
                default: 0
          - id: "select_cnae"
            type: "select"
            multiple: true
            label: "Setor Econômico"
            api:
              template: "/sst/cats?categorias=ds_cnae_classe_cat&agregacao=distinct&ordenacao=ds_cnae_classe_cat&filtros=ne-ds_cnae_classe_cat-'',and,eq-cd_uf-{0},and,eq-ano_cat-2023,and,nn-cd_uf"
              args:
                - named_prop: "cd_uf"
                - base_object: "sst_cat"
                  named_prop: "agr_max_ano_cat"
            args:
              - prop: "id"
                named_prop: "ds_cnae_classe_cat"
              - prop: "label"
                named_prop: "ds_cnae_classe_cat"
                null_value: "(Não informado)"
            selection:
              event: "selection" 
              rules:
                filter: ",and,in-ds_cnae_classe_cat-{0}"
                api:
                  args:
                    - named_prop: "ds_cnae_classe_cat"
        chart_type: "MAP_TOPOJSON"
        api: 
          template: "/sst/cats?categorias=cd_municipio_ibge_dv,nm_municipio,nm_uf,ano_cat&agregacao=COUNT&filtros=eq-cd_uf-{0},and,eq-ano_cat-2023,and,nn-cd_uf"
          args:
            - named_prop: "cd_uf"
            - base_object: "sst_cat"
              named_prop: "agr_max_ano_cat"
          options:
            calcs:
              - id: "log_cat"
                function: "get_log"
                fn_args:
                  - fixed: "agr_count"
            formatters:
              - id: "agr_count"
                format: 'inteiro'
        headers:
          - text: 'Município'
            align: 'left'
            value: 'nm_municipio'
          - text: 'Ano'
            align: 'left'
            value: 'ano_cat'
          - text: 'Nº de Notificações de Acidente de Trabalho'
            value: 'fmt_agr_count'
        chart_options:
          id_field: 'cd_municipio_ibge_dv'
          topo_key: "codarea"
          value_field: 'calc_log_cat'
          colorScale:
            name: "Reds"
        source:
          desc: "Previdência Social"
