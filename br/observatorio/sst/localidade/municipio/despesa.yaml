# ===================================================
principais:
  - relevance: 'lead' 
    cls: 'xs12 xl6'
    rowClass: "pt-0 px-3 pb-5"
    api:
      template: "/sst/beneficios?categorias=ano_beneficio&valor=qt_despesa_total&agregacao=SUM&ordenacao=ano_beneficio&filtros=eq-cd_municipio_ibge_dv-{0},and,eq-cd_especie_beneficio-31,and,eq-ano_beneficio-{1}"
      args:
        - named_prop: "idLocalidade"
        - base_object: "sst_beneficio"
          named_prop: "agr_max_ano_beneficio"
    # preloaded:
    #   prop: "centralindicadores"
    #   function: "slice"
    #   id: "10_11_01_01"
    #   year: "max"
    args:
      - prop: "value"
        named_prop: 'agr_sum_qt_despesa_total'
        format: 'real'
        collapse:
          format: 'real'
      - prop: "description"
        fixed: "Gastos previdenciários com AUXÍLIO-DOENÇA (B31)"
      - prop: 'comment'
        template: "(Instituto Nacional do Seguro Social (INSS), {0})"
        args:
          - base_object: "sst_beneficio"
            named_prop: "agr_max_ano_beneficio"
  - relevance: 'lead' 
    cls: 'xs12 xl6'
    rowClass: "pt-0 px-3 pb-5"
    api:
      template: "/sst/beneficios?categorias=ano_beneficio&valor=qt_despesa_total&agregacao=SUM&ordenacao=ano_beneficio&filtros=eq-cd_municipio_ibge_dv-{0},and,eq-cd_especie_beneficio-32,and,eq-ano_beneficio-{1}"
      args:
        - named_prop: "idLocalidade"
        - base_object: "sst_beneficio"
          named_prop: "agr_max_ano_beneficio"
    # preloaded:
    #   prop: "centralindicadores"
    #   function: "slice"
    #   id: "10_11_01_02"
    #   year: "max"
    args:
      - prop: "value"
        named_prop: 'agr_sum_qt_despesa_total'
        format: 'real'
        collapse:
          format: 'real'
      - prop: "description"
        fixed: "Gastos previdenciários com  APOSENTADORIA POR INVALIDEZ (B32)"
      - prop: 'comment'
        template: "(Instituto Nacional do Seguro Social (INSS), {0})"
        args:
          - base_object: "sst_beneficio"
            named_prop: "agr_max_ano_beneficio"
# ===================================================
secoes:
  - id: "duracao_unica"
    name: ""
    cards:

# ========================================================
      - id: "bar_despesa_auxilio_doenca_acidente"
        title: 
          fixed: "Despesa Previdenciária - Auxílio-doença por acidente do trabalho (B91)"
        title_comment:
          template: "{0}, de {1} a {2}"
          args:
            - base_object: "localidade"
              named_prop: "nm_localidade"
            - base_object: "sst_beneficio"
              named_prop: "agr_min_ano_beneficio"
            - base_object: "sst_beneficio"
              named_prop: "agr_max_ano_beneficio"          
        # info:
        #   - type: "text"
        #     title: "Sobre a métrica"
        #     content:
        #       fixed: "" 
        description:
          - type: "minicards"
            cards:
              - relevance: 'high'
                cls: 'xs12'
                api:
                  template: "/sst/beneficios?categorias=ano_beneficio&valor=qt_despesa_total&agregacao=SUM&ordenacao=ano_beneficio&filtros=eq-cd_municipio_ibge_dv-{0},and,eq-cd_especie_beneficio-91,and,eq-ano_beneficio-{1}"
                  args:
                    - named_prop: "idLocalidade"
                    - base_object: "sst_beneficio"
                      named_prop: "agr_max_ano_beneficio"
                args:
                  - prop: "value"
                    named_prop: 'agr_sum_qt_despesa_total'
                    format: 'monetario'
                    collapse:
                      format: 'monetario'
                    # precision: 1
                    default: "Sem Registros"
                  - prop: "description"
                    fixed: "Em gastos com o benefício"
                  - prop: "comment"
                    named_prop: "ano_beneficio"
          - type: "text"
            title: ""
            content:
              fixed: "Em destaque, informações sobre a despesa previdenciária para custeio do  benefício - Auxílio doença por acidente do trabalho (B91). Ao lado, é possível ver o valor pago para benefícios iniciados em cada ano de referência, bem como o acumulado no período considerado."
        chart_type: "BAR"
        api:
          template: "/sst/beneficios?categorias='auxilio'-id,'Auxílio doença por acidente do trabalho (B91)'-ds_agreg_primaria,'Despesa Previdenciária  Auxílio doença por acidente do trabalho (B91)'-ds_indicador_radical,ano_beneficio&valor=qt_despesa_total&agregacao=SUM&ordenacao=ano_beneficio&filtros=eq-cd_municipio_ibge_dv-{0},and,eq-cd_especie_beneficio-91"
          args:
            - named_prop: "idLocalidade"
        options:
            formatters:
              - id: "agr_sum_qt_despesa_total"
                collapse:
                  format: 'real'
                  precision: 1
                  uiTags: false
        headers:
          - text: 'Indicador'
            value: 'ds_indicador_radical'
          - text: 'Ano'
            align: 'left'
            value: 'ano_beneficio'
          - text: 'Valor'
            value: 'bar_label'
        chart_options:
          x: "ano_beneficio"
          y: "agr_sum_qt_despesa_total"
          id: "id"
          orientation: "vertical"
          accum: true
          accumDataType: 'real'
          accumDataPrecision: 1
          accumDataCollapse: true
          stacked: true
          show_x_axis: true
          show_y_axis: false
          legend_field: "ds_agreg_primaria"
        source:
          desc_text: "Instituto Nacional do Seguro Social (INSS)"
