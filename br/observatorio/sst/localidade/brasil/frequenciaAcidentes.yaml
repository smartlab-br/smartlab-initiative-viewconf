          - type: "text"
            title: ""
            content:
              fixed: "Em destaque, o número de notificações de acidentes de trabalho fatal entre a população com vínculo de emprego regular no ano indicado, incluindo tanto as Comunicações de Acidente de Trabalho (CAT) quanto os benefícios acidentários concedidos sem comunicação prévia (acidentes identificados no momento da concessão do benefício, sem registro de CAT) e a estimativa projetada para o mesmo ano.<br/>
                      No gráfico, apresenta-se a evolução histórica do número de notificações com óbito no período, com base no Anuário Estatístico de Acidentes do Trabalho (AEAT, 2012 a 2023) e em dados da Previdência Social (2024). Considera-se o momento da compilação dos dados. Os números referentes a anos anteriores tendem a ser complementados de acordo com a chegada de notificações atrasadas nos anos subsequentes.<br/>                      
                      Com base na análise da maturação temporal dos dados históricos desde 2024 até 2014 (em retrospecto, excetuado o ano da pandemia), realizou-se uma projeção estatística para o valor final do indicador em 2024, ainda em apuração. <br/>
                      Utilizou-se o ano de 2023 como referência para modelar a dinâmica de crescimento: estimou-se um fator multiplicativo que representa a evolução do dado desde seu estágio preliminar (correspondente a ~1-3 meses de apuração, como o atual valor de 2024) até sua consolidação final (~1 ano), calibrando este fator a partir do crescimento observado em 2023 entre seu valor de anuário e o valor atual, sob uma suposição sobre a intensidade relativa do crescimento no período inicial. Este fator de crescimento foi então aplicado ao valor preliminar conhecido de 2024 para obter a estimativa pontual projetada.<br/>
                      É importante notar, ainda, que o tempo de processamento das informações via e-social aumentou. Pretende-se, portanto, atualizar esses números nas próximas edições."
