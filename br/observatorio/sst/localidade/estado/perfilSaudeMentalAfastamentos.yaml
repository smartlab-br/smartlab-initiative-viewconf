            args:
              - prop: "min"
                named_prop: "agr_min_ano_beneficio"
              - prop: "max"
                named_prop: "agr_max_ano_beneficio"
            selection:
              event: "selection"
              rules:
                filter: ",and,ge-ano_beneficio-{0},and,le-ano_beneficio-{1}"
                api:
                  args:
                    - named_prop: "value_min"
                    - named_prop: "value_max"
