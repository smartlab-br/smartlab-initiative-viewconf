# ===================================================
principais:
  - relevance: 'lead' 
    cls: 'xs12 xl6'
    rowClass: "pt-0 px-3 pb-5"
    api:
      template: "/sst/beneficios?categorias=ano_beneficio&agregacao=COUNT&filtros=eq-cd_especie_beneficio-91,and,eq-ano_beneficio-{0},and,lk-cd_categoria_cid_beneficio-'F%25'"
      args:
        - base_object: "sst_beneficio"
          named_prop: "agr_max_ano_beneficio"
    args:
      - prop: "value"
        named_prop: 'agr_count'
        format: 'inteiro'
        collapse:
          format: 'real'
      - prop: "description"
        fixed: "CONCESSÕES DE BENEFÍCIO PREVIDENCIÁRIO - AUXÍLIO-DOENÇA POR ACIDENTE DE TRABALHO (B91) - SAÚDE MENTAL"
      - prop: 'comment'
        template: "(INSS/BENEFÍCIOS, {0})"
        args:
          - named_prop: "ano_beneficio"

  - relevance: 'lead' 
    cls: 'xs12 xl6'
    rowClass: "pt-0 px-3 pb-5"
    api:
      template: "/sst/beneficios?categorias=ano_beneficio&agregacao=COUNT&filtros=eq-cd_especie_beneficio-31,and,eq-ano_beneficio-{0},and,lk-cd_categoria_cid_beneficio-'F%25'"
      args:
        - base_object: "sst_beneficio"
          named_prop: "agr_max_ano_beneficio"
    args:
      - prop: "value"
        named_prop: 'agr_count'
        format: 'inteiro'
        collapse:
          format: 'real'
      - prop: "description"
        fixed: "CONCESSÕES DE BENEFÍCIO PREVIDENCIÁRIO - AUXÍLIO-DOENÇA (B31) - SAÚDE MENTAL"
      - prop: 'comment'
        template: "(INSS/BENEFÍCIOS, {0})"
        args:
          - named_prop: "ano_beneficio"        
  
