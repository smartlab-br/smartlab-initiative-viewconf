# ====================================================          
      - id: "bar_cat"
        title: 
          fixed: "Notificações de Acidentes de Trabalho (com CAT e sem CAT) - Série"
        title_comment:
          template: "Brasil, de 2012 a {1}"
          api:
            - fixed: "/sst/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia,nu_competencia_min,nu_competencia_max&filtros=eq-cd_indicador-'sst_cat_total',and,gt-nu_competencia-2011"
            - fixed: "/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia,nu_competencia_min,nu_competencia_max&filtros=eq-cd_indicador-'09_01_01_00',and,gt-nu_competencia-'2011'"
          args:
            - id: "09_01_01_00"
              named_prop: "nu_competencia_min"
            - id: "sst_cat_total"
              named_prop: "nu_competencia_max"
        info:
          - type: "text"
            title: "Sobre a métrica"
            content:
              template: "Define-se como acidente do trabalho aquele que ocorre pelo exercício do trabalho a serviço da empresa ou pelo exercício do trabalho dos segurados especiais, provocando lesão corporal ou perturbação funcional, permanente ou temporária, que cause a morte, a perda ou a redução da capacidade para o trabalho.<br/>
                          Consideram-se acidente do trabalho a doença profissional e a doença do trabalho. Equiparam-se também ao acidente do trabalho: o acidente ligado ao trabalho que, embora não tenha sido a causa única, haja contribuído diretamente para a ocorrência da lesão; certos acidentes sofridos pelo segurado no local e no horário de trabalho; a doença proveniente de contaminação acidental do empregado no exercício de sua atividade; e o acidente sofrido a serviço da empresa ou no trajeto entre a residência e o local de trabalho do segurado e vice-versa.<br/>
                          Os dados brutos analisados têm as seguintes referências fundamentais, para consulta e conferência:<br/>
                          Nome: {0}<br/>Fonte: {1}<br/>Ano: 2012 a {3}<br/>
                          Nome: {4}<br/>Fonte: {5}<br/>Ano: 2012 a {6}"
              api:
                - fixed: "/sst/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia,nu_competencia_min,nu_competencia_max&filtros=eq-cd_indicador-'sst_cat_total',and,gt-nu_competencia-2011"
                - fixed: "/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia,nu_competencia_min,nu_competencia_max&filtros=eq-cd_indicador-'09_01_01_00',and,gt-nu_competencia-'2011'"
              args:
                - id: "09_01_01_00"
                  named_prop: 'cd_indicador'
                - id: "09_01_01_00"
                  named_prop: 'ds_fonte'
                - id: "09_01_01_00"
                  named_prop: 'nu_competencia_min'
                - id: "09_01_01_00"
                  named_prop: 'nu_competencia_max'
                - id: "sst_cat_total"
                  named_prop: 'cd_indicador'
                - id: "sst_cat_total"
                  named_prop: 'ds_fonte'
                - id: "sst_cat_total"
                  named_prop: 'nu_competencia_max'
        description:
          - type: "minicards"
            cards:
              - relevance: 'high'
                cls: 'xs12 md6'
                api:
                  fixed: "/sst/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-2023"
                args:
                  - prop: "value"
                    named_prop: 'vl_indicador'
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    fixed: "ACIDENTES NO PAÍS"
                  - prop: "comment"
                    named_prop: 'nu_competencia'
              - relevance: 'high'
                cls: 'xs12 md6'
                api:
                  fixed: "/sst/indicadoresnacionais?categorias=cd_indicador,vl_indicador,ds_fonte,nu_competencia&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-nu_competencia_max"
                args:
                  - prop: "value"
                    function: 'calc_multiplication_ds'
                    fn_args:
                      - fixed: 1
                      - named_prop: "vl_indicador"
                      - fixed: 1.258
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    fixed: "ACIDENTES NO PAÍS<br/>PROJEÇÃO"      
                  - prop: "comment"
                    named_prop: 'nu_competencia'
          - type: "text"
            title: ""
            content:
              fixed: "Em destaque, o número de notificações de acidentes de trabalho entre a população com vínculo de emprego regular no ano indicado, incluindo tanto as Comunicações de Acidente de Trabalho (CAT) quanto os benefícios acidentários concedidos sem comunicação prévia (acidentes identificados no momento da concessão do benefício, sem registro de CAT) e a estimativa projetada para o mesmo ano.<br/>
                      No gráfico, apresenta-se a evolução histórica do número de notificações no período, com base no Anuário Estatístico de Acidentes do Trabalho (AEAT, 2012 a 2023) e em dados da Previdência Social (2024). Considera-se o momento da compilação dos dados. Os números referentes a anos anteriores tendem a ser complementados de acordo com a chegada de notificações atrasadas nos anos subsequentes.<br/>
                      Com base na análise da maturação temporal dos dados históricos desde 2024 até 2014 (em retrospecto, excetuado o ano da pandemia), realizou-se uma projeção estatística para o valor final do indicador em 2024, ainda em apuração. <br/>
                      Utilizou-se o ano de 2023 como referência para modelar a dinâmica de crescimento: estimou-se um fator multiplicativo que representa a evolução do dado desde seu estágio preliminar (correspondente a ~1-3 meses de apuração, como o atual valor de 2024) até sua consolidação final (~1 ano), calibrando este fator a partir do crescimento observado em 2023 entre seu valor de anuário e o valor atual, sob uma suposição sobre a intensidade relativa do crescimento no período inicial. Este fator de crescimento foi então aplicado ao valor preliminar conhecido de 2024 para obter a estimativa pontual projetada.<br/>
                      É importante notar, ainda, que o tempo de processamento das informações via e-social aumentou. Pretende-se, portanto, atualizar esses números nas próximas edições."
        chart_type: "BAR"
        api: 
          - fixed: "/indicadoresnacionais?categorias=vl_indicador-calc_vl_texto,'cat_aeat'-id,cast(nu_competencia as integer) nu_competencia,vl_indicador-calc_vl_indicador,cd_indicador,'AEAT'-ds_fonte&filtros=eq-cd_indicador-'09_01_01_00',and,gt-nu_competencia-'2011'"
            options:
              formatters:
                - id: "calc_vl_texto"
                  format: 'inteiro'
          - fixed: "/sst/indicadoresnacionais?categorias=vl_indicador-calc_vl_texto,'cat'-id,nu_competencia,vl_indicador-calc_vl_indicador,cd_indicador,ds_indicador,'Previdência Social'-ds_fonte&filtros=eq-cd_indicador-'sst_cat_total',and,gt-nu_competencia-2011"
            options:
              formatters:
                - id: "calc_vl_texto"
                  format: 'inteiro'
          - fixed: "/sst/indicadoresnacionais?categorias='cat_projecao'-id,nu_competencia,vl_indicador,cd_indicador,ds_indicador,'Projeção'-ds_fonte&filtros=eq-cd_indicador-'sst_cat_total',and,eq-nu_competencia-nu_competencia_max"
            options:
              calcs:
                - id: "vl_texto"
                  function: "calc_multiplication_ds"
                  fn_args:
                    - named_prop: "vl_indicador"
                    - fixed: 1.258
                - id: "vl_indicador"
                  function: "calc_subtraction_ds"
                  fn_args:
                    - named_prop: "calc_vl_texto"
                    - named_prop: "vl_indicador"
              formatters:
                - id: "calc_vl_texto"
                  format: 'inteiro'
        headers:
          - text: 'Ano'
            align: 'left'
            value: 'nu_competencia'
          - text: 'Fonte'
            align: 'left'
            value: 'ds_fonte'
          - text: 'Nº de Notificações de Acidente de Trabalho'
            value: 'fmt_calc_vl_texto'
        chart_options:
          id: "id"
          x: "nu_competencia"
          y: "calc_vl_texto"
          orientation: "vertical"
          text: "fmt_calc_vl_texto"
          # stacked: true
          show_x_axis: true
          show_y_axis: false
          hide_legend: true
          colorArray: ["#238B45", "ff7f0e", "377EB8"]
        source:
          desc: "AEAT e Previdência Social"
