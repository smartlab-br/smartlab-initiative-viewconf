# =====================================================
      - id: "multicharts_concessao_B31_B91_Brasil"
        type: "multiple-charts"
        title: 
          fixed: "Concessão de Benefícios Previdenciários associados à saúde mental, acidentários e comuns (B91 + B31) - Série Histórica"
        title_comment:
          template: "Brasil, de {0} a {1}"
          args:
            - base_object: "sst_beneficio"
              named_prop: "agr_min_ano_beneficio"
            - base_object: "sst_beneficio"
              named_prop: "agr_max_ano_beneficio"
        
        description:
          - type: "text"
            title: ""
            content:
                fixed: "Em destaque, especificamente no que se refere à saúde mental, o número acumulado de concessões de benefícios previdenciários, acidentários (B91) ou não (B31), de 2012 a 2024. No gráfico, apresenta-se a evolução histórica do número de concessões no período. No filtro, pode-se filtrar por setor econômico."
          - id: "select_cnae"
            type: "select"
            multiple: true
            label: "Setor Econômico"
            api:
              template: "/sst/beneficios?categorias=ds_cnae_classe&agregacao=distinct&ordenacao=ds_cnae_classe"
              args:
                - named_prop: "idLocalidade"
            args:
              - prop: "id"
                named_prop: "ds_cnae_classe"
              - prop: "label"
                named_prop: "ds_cnae_classe"
                null_value: "(Não informado)"
            selection:
              event: "selection" 
              rules:
                filter: ",and,in-ds_cnae_classe-{0}"
                api:
                  args:
                    - named_prop: "ds_cnae_classe"
          
        charts:
# =====================================================
          - id: "bar_ben_91"
            cls: "xs12"
            footnote: 
                fixed: "Concessão de Benefícios Previdenciários associados à saúde mental, acidentários e comuns (B91 + B31) - Série Histórica"
            type: "BAR"
            api:
              fixed: "/sst/beneficios?categorias=ano_beneficio&agregacao=COUNT&filtros=in-cd_especie_beneficio-91-31,and,lk-cd_categoria_cid_beneficio-'F%25'"
            api_options:
              formatters:
                - id: "agr_count"
                  format: "inteiro"
            headers:
                - text: 'Ano'
                  align: 'left'
                  value: 'ano_beneficio'
                - text: 'Qtde de Benefícios B91 + B31'
                  value: 'fmt_agr_count'
            options:
                id: "ano_beneficio"
                x: "ano_beneficio"
                y: "agr_count"
                orientation: "vertical"
                text: "fmt_agr_count"
                show_x_axis: true
                show_y_axis: false
                hide_legend: true
                color: "#238B45"                          
