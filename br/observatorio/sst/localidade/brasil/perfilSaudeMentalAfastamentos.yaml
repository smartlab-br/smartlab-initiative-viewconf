# =====================================================
      - id: "treemap_afast_cod_cid"
        type: "multiple-charts"
        title: 
          fixed: "Causas de afastamento associadas à saúde mental conforme CID 10"
        title_comment:
          template: "Brasil, de {0} a {1}"
          args:
            - base_object: "sst_beneficio"
              named_prop: "agr_min_ano_beneficio"
            - base_object: "sst_beneficio"
              named_prop: "agr_max_ano_beneficio"
        info:
          - type: "text"
            title: "Sobre a métrica"
            content:
              fixed: "Sem observações adicionais. Vide descrição"
        description:
          - type: "minicards"
            cards:
              - relevance: 'high'
                cls: 'xs6'
                api:
                  template: "/sst/beneficios?categorias=ano_beneficio,cd_categoria_cid_beneficio,ds_categoria_cid_beneficio&agregacao=COUNT&filtros=ne-ds_categoria_cid_beneficio-'',and,eq-cd_especie_beneficio-91,and,eq-ano_beneficio-{0},and,lk-cd_categoria_cid_beneficio-'F%25'&ordenacao=-agr_count&limit=1"
                  args:
                    - base_object: "sst_beneficio"
                      named_prop: "agr_max_ano_beneficio"
                args:
                  - prop: "value"
                    named_prop: 'agr_count'
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    template: '{0} - {1}<br/>B91'
                    args:
                      - named_prop: "cd_categoria_cid_beneficio"
                      - named_prop: "ds_categoria_cid_beneficio"
                  - prop: "comment"
                    named_prop: 'ano_beneficio'
              - relevance: 'high'
                cls: 'xs6'
                api:
                  template: "/sst/beneficios?categorias=ano_beneficio,cd_categoria_cid_beneficio,ds_categoria_cid_beneficio&agregacao=COUNT&filtros=ne-ds_categoria_cid_beneficio-'',and,eq-cd_especie_beneficio-31,and,eq-ano_beneficio-{0},and,lk-cd_categoria_cid_beneficio-'F%25'&ordenacao=-agr_count&limit=1"
                  args:
                    - base_object: "sst_beneficio"
                      named_prop: "agr_max_ano_beneficio"
                args:
                  - prop: "value"
                    named_prop: 'agr_count'
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    template: '{0} - {1}<br/>B91'
                    args:
                      - named_prop: "cd_categoria_cid_beneficio"
                      - named_prop: "ds_categoria_cid_beneficio"
                  - prop: "comment"
                    named_prop: 'ano_beneficio'
          - type: "text"
            title: ""
            content:
              api: 
                fixed: "/sst/beneficios?categorias=1&valor=ano_beneficio&agregacao=MIN,MAX"
              template: "Em destaque, especificamente no que se refere à saúde mental, os códigos da Classificação Internacional de Doenças (CID) mais frequentemente associados a afastamentos do tipo acidentário (B91) e não acidentário (B31) no último ano apurado para a unidade geográfica selecionada, considerado o universo de trabalhadores com vínculo de emprego. No gráfico ao lado, comparam-se, para o período de {0} a {1}, as diferenças entre os benefícios acidentários e não acidentários. Isso permite, inclusive, a identificação de mudanças de padrão quanto ao motivo mais frequente, a percepçaõ de tendências e distinções quantitativas relevantes. Utilize os filtros abaixo para combinar as perspectivas."
              args:
                - named_prop: "agr_min_ano_beneficio"
                - named_prop: "agr_max_ano_beneficio"
          - id: "slider_ano"
            type: "slider"
            range: true
            api: 
              fixed: "/sst/beneficios?categorias=1&valor=ano_beneficio&agregacao=MIN,MAX"
            args:
              - prop: "min"
                named_prop: "agr_min_ano_beneficio"
              - prop: "max"
                named_prop: "agr_max_ano_beneficio"
            selection:
              event: "selection"
              rules:
                filter: ",and,ge-ano_beneficio-{0},and,le-ano_beneficio-{1}"
                api:
                  args:
                    - named_prop: "value_min"
                    - named_prop: "value_max"
          - id: "select_cnae"
            type: "select"
            multiple: true
            label: "Setor Econômico"
            api:
              template: "/sst/beneficios?categorias=ds_cnae_classe&agregacao=distinct&ordenacao=ds_cnae_classe"
              args:
                - named_prop: "idLocalidade"
            args:
              - prop: "id"
                named_prop: "ds_cnae_classe"
              - prop: "label"
                named_prop: "ds_cnae_classe"
                null_value: "(Não informado)"
            selection:
              event: "selection" 
              rules:
                filter: ",and,in-ds_cnae_classe-{0}"
                api:
                  args:
                    - named_prop: "ds_cnae_classe"
          - id: "select_cbo"
            type: "select"
            multiple: true
            label: "Ocupações"
            api:
              template: "/sst/beneficios?categorias=ds_cbo2002&agregacao=distinct&ordenacao=ds_cbo2002"
              args:
                - named_prop: "idLocalidade"
            args:
              - prop: "id"
                named_prop: "ds_cbo2002"
              - prop: "label"
                named_prop: "ds_cbo2002"
                null_value: "(Não identificado)"
            selection:
              event: "selection" 
              rules:
                filter: ",and,in-ds_cbo2002-{0}"
                api:
                  args:
                    - named_prop: "ds_cbo2002"
        charts:
# =====================================================
          - id: "treemap_afast_cod_cid_b91"
            cls: "xs12 md6"
            footnote: 
              template: "Afastamentos por Código CID - B91 ({0}-{1})"
              args:
                - base_object: "sst_beneficio"
                  named_prop: "agr_min_ano_beneficio"
                - base_object: "sst_beneficio"
                  named_prop: "agr_max_ano_beneficio"
            type: "TREEMAP"
            api: 
              fixed: "/sst/beneficios?categorias=cd_categoria_cid_beneficio,ds_categoria_cid_beneficio&agregacao=COUNT&filtros=ne-ds_categoria_cid_beneficio-'',and,eq-cd_especie_beneficio-91,and,lk-cd_categoria_cid_beneficio-'F%25'"
              options:
                calcs:
                  - id: "bar_description"
                    function: "applyInterpolReplaceDatasetParam"
                    fn_args:
                      - fixed: 
                          template: "{0} - {1}"
                          args:
                            - named_prop: "cd_categoria_cid_beneficio"
                            - named_prop: "ds_categoria_cid_beneficio"
                formatters:
                  - id: "agr_count"
                    format: 'inteiro'
            headers:
              - text: 'Código CID'
                value: 'cd_categoria_cid_beneficio'
              - text: 'Descrição'
                value: 'ds_categoria_cid_beneficio'
              - text: 'Qtde'
                value: 'fmt_agr_count'
            options:
              id: "cd_categoria_cid_beneficio"
              size: "agr_count"
              text: "calc_bar_description"
              hide_legend: true
              colorScale:
                name: "Reds"
            # source:
            #   desc_field: "ds_fonte"                    
# =====================================================
          - id: "treemap_afast_cod_cid_b31"
            cls: "xs12 md6"
            footnote: 
              template: "Afastamentos por Código CID - B31 ({0}-{1})"
              args:
                - base_object: "sst_beneficio"
                  named_prop: "agr_min_ano_beneficio"
                - base_object: "sst_beneficio"
                  named_prop: "agr_max_ano_beneficio"
            type: "TREEMAP"
            api: 
              fixed: "/sst/beneficios?categorias=cd_categoria_cid_beneficio,ds_categoria_cid_beneficio&agregacao=COUNT&filtros=ne-ds_categoria_cid_beneficio-'',and,eq-cd_especie_beneficio-31,and,lk-cd_categoria_cid_beneficio-'F%25'"
              options:
                calcs:
                  - id: "bar_description"
                    function: "applyInterpolReplaceDatasetParam"
                    fn_args:
                      - fixed: 
                          template: "{0} - {1}"
                          args:
                            - named_prop: "cd_categoria_cid_beneficio"
                            - named_prop: "ds_categoria_cid_beneficio"
                formatters:
                  - id: "agr_count"
                    format: 'inteiro'
            headers:
              - text: 'Código CID'
