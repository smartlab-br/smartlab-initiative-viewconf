secoes:
  - id: "duracao_unica"
    name: ""
    cards:
# ========================================================
      - id: "bar_despesa_auxilio_doenca_acidente"
        title: 
          fixed: "Despesa Previdenciária - Auxílio-doença por acidente do trabalho (B91)"
        title_comment:
          template: "Brasil, de {0} a {1}"
          args:
            - base_object: "sst_beneficio"
              named_prop: "agr_min_ano_beneficio"
            - base_object: "sst_beneficio"
              named_prop: "agr_max_ano_beneficio"
        info:
          - type: "text"
            title: "Sobre a métrica"
            content:
              fixed: "" 
        description:
          - type: "minicards"
            cards:
              - relevance: 'high'
                cls: 'xs12'
                api:
                  template: "/sst/beneficios?categorias=ano_beneficio&valor=qt_despesa_total&agregacao=SUM&ordenacao=ano_beneficio&filtros=eq-cd_especie_beneficio-91,and,eq-ano_beneficio-{0}"
                  args:
                    - base_object: "sst_beneficio"
                      named_prop: "agr_max_ano_beneficio"
                # preloaded:
                #   prop: "centralindicadores"
                #   function: "slice"
                #   id: "10_11_01_03"
                #   year: "max"
                args:
                  - prop: "value"
                    named_prop: 'agr_sum_qt_despesa_total'
                    format: 'monetario'
                    collapse:
                      format: 'monetario'
                    default: "Sem Registros"
                  - prop: "description"
                    fixed: "Em gastos com o benefício"
                  - prop: "comment"
                    named_prop: "ano_beneficio"

          - type: "text"
            title: ""
            content:
              fixed: "Em destaque, informações sobre Despesa Previdenciária - Auxílio-doença por acidente do trabalho (B91). Ao lado, é possível ver o valor pago a cada ano, bem como o acumulado no período considerado."
        chart_type: "BAR"
        api:
          fixed: "/sst/beneficios?categorias='auxilio'-id,'Auxíliodoença por acidente do trabalho (B91)'-ds_agreg_primaria,'Despesa Previdenciária  Auxílio doença por acidente do trabalho (B91)'-ds_indicador_radical,ano_beneficio&valor=qt_despesa_total&agregacao=SUM&ordenacao=ano_beneficio&filtros=eq-cd_especie_beneficio-91"
        # preloaded:
        #   prop: "centralindicadores"
        #   function: "slice"
        #   id: ['10_11_01_03']
          options:
            formatters:
              - id: "agr_sum_qt_despesa_total"
                format: 'real'
                collapse:
                  format: 'real'
                  precision: 1
                  uiTags: false
        headers:
          - text: 'Indicador'
            value: 'ds_indicador_radical'
          - text: 'Ano'
            align: 'left'
            value: 'ano_beneficio'
          - text: 'Valor'
            value: 'bar_label'
        chart_options:
          x: "ano_beneficio"
          y: "agr_sum_qt_despesa_total"
          id: "id"
          orientation: "vertical"
          accum: true
          accumDataType: 'real'
          accumDataPrecision: 1
          accumDataCollapse: true
          stacked: true
          show_x_axis: true
          show_y_axis: false
          legend_field: "ds_agreg_primaria"
        source:
          desc_text: "Instituto Nacional do Seguro Social (INSS)"
