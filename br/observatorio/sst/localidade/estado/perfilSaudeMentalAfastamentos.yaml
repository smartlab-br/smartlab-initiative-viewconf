            type: "select"
            multiple: true
            label: "Setor Econômico"
            api:
              template: "/sst/beneficios?categorias=ds_cnae_classe&agregacao=distinct&ordenacao=ds_cnae_classe&filtros=eq-cd_uf-{0}"
              args:
                - named_prop: "idLocalidade"
            args:
              - prop: "id"
                named_prop: "ds_cnae_classe"
              - prop: "label"
                named_prop: "ds_cnae_classe"
                null_value: "(Não informado)"
            selection:
              event: "selection" 
              rules:
                filter: ",and,in-ds_cnae_classe-{0}"
                api:
                  args:
                    - named_prop: "ds_cnae_classe"
          
        charts:
          - id: "treemap_benef_cbo_b91"
            cls: "xs12 md6"
            footnote: 
              template: "Ocupações- B91 ({0}-{1})"
              args:
