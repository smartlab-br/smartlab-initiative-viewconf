      - id: "bar_ben_b31_dias_perdidos"
        title: 
          fixed: "Dias Perdidos de Vida Saudável e de Atividade Produtiva por Problemas de Saúde Mental (B31)"
        title_comment:
          template: "Brasil,de {0} a {1}"
          args:
            - base_object: "sst_beneficio"
              named_prop: "agr_min_ano_beneficio"
            - base_object: "sst_beneficio"
              named_prop: "agr_max_ano_beneficio"  
        description:
          - type: "minicards"
            cards:
              - relevance: 'high'
                cls: 'xs12'
                api:
                  fixed: "/sst/beneficios?categorias=''&agregacao=sum&valor=qt_dias_perdidos&filtros=eq-cd_especie_beneficio-31,and,lk-cd_categoria_cid_beneficio-'F%25'"
                args:
                  - prop: "value"
                    named_prop: 'agr_sum_qt_dias_perdidos'
                    format: 'inteiro'
                    collapse:
                      format: 'real'
                    default: "Sem Registros"
                  - prop: "description"
                    fixed: "B31 - DIAS PERDIDOS"
          - type: "text"
            title: ""
            content:
              fixed: "Em destaque, o total de dias perdidos em razão de afastamentos previdenciários em função de transtornos mentais e comportamentais na série histórica considerada. No gráfico ao lado, a evolução da série histórica de dias perdidos, ano a ano. Foram somados todos os dias em que as pessoas não trabalharam em virtude de afastamentos previdenciários, período que se considera, igualmente, como vivido com déficits de saúde mental. Somaram-se todos os dias de afastamento individualmente ocorridos - muitos, é claro, ao mesmo tempo. Trata-se de métrica usual para medir por aproximação (proxy) os prejuízos de produtividade para a economia formal e, ainda, a quantidade total de dias vividos com transtornos mentais, no âmbito da população afastada."
        chart_type: "BAR"
        api:
          fixed: "/sst/beneficios?categorias='dias'-id,ano_beneficio,'Dias Perdidos'-ds_indicador_radical&agregacao=sum&valor=qt_dias_perdidos&filtros=eq-cd_especie_beneficio-31,and,lk-cd_categoria_cid_beneficio-'F%25'"
        api_options:
          formatters:
            - id: "agr_sum_qt_dias_perdidos"
              format: "inteiro"
        headers:
          - text: 'Indicador'
            value: 'ds_indicador_radical'
          - text: 'Ano'
            align: 'left'
            value: 'ano_beneficio'
          - text: 'Dias Perdidos - Benefícios B31 - Auxílio-doença - Saúde mental'
            value: 'bar_label'
        chart_options:
          id: "id"
          x: "ano_beneficio"
          y: "agr_sum_qt_dias_perdidos"
          orientation: "vertical"
          text: "fmt_agr_sum_qt_dias_perdidos"
          legend_field: "ds_indicador_radical"
          show_x_axis: true
          show_y_axis: false
          hide_legend: true
          stacked: true
          accum: true
