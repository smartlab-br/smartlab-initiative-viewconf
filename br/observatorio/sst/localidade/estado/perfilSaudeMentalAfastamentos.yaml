              api: 
                template: "/sst/beneficios?categorias=nm_uf&valor=ano_beneficio&agregacao=MIN,MAX&filtros=eq-cd_uf-{0}"
                args:
                  - named_prop: "idLocalidade"
              template: "Em destaque, especificamente no que se refere à saúde mental, as ocupações mais frequentemente vitimadas por afastamentos do tipo acidentário (B91) e não acidentário (B31) no período apurado para a unidade geográfica selecionada, considerado o universo de trabalhadores com vínculo de emprego. No gráfico ao lado, comparam-se, para o período de {0} a {1}, as diferenças entre os benefícios acidentários e não acidentários. Isso permite, inclusive, a identificação de mudanças de padrão quanto ao motivo mais frequente, a percepção de tendências e distinções quantitativas relevantes. Utilize os filtros abaixo para combinar as perspectivas."
              args:
                - named_prop: "agr_min_ano_beneficio"
                - named_prop: "agr_max_ano_beneficio"
          - id: "slider_ano"
            type: "slider"
            range: true
            api: 
